{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card auth-card-wide">
            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join BuyMe and start bidding on premium electronics</p>
            </div>

            <form method="POST" action="{{ url_for('auth.register') }}" class="auth-form" id="register-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name" class="form-label">First Name</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="first_name"
                                name="first_name"
                                class="form-input"
                                placeholder="John"
                                value="{{ first_name | default('') }}"
                                required
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="last_name" class="form-label">Last Name</label>
                        <div class="input-wrapper">
                            <input
                                type="text"
                                id="last_name"
                                name="last_name"
                                class="form-input"
                                placeholder="Doe"
                                value="{{ last_name | default('') }}"
                                required
                            >
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="form-input"
                            placeholder="Choose a username"
                            value="{{ username | default('') }}"
                            required
                            minlength="3"
                            autocomplete="username"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✉️</span>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-input"
                            placeholder="you@example.com"
                            value="{{ email | default('') }}"
                            required
                            autocomplete="email"
                        >
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-input"
                                placeholder="Min. 6 characters"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password" class="form-label">Confirm Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input
                                type="password"
                                id="confirm_password"
                                name="confirm_password"
                                class="form-input"
                                placeholder="Repeat password"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="register-btn">
                    Create Account
                    <span class="btn-arrow">→</span>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="{{ url_for('auth.login') }}" class="auth-link">Sign in</a></p>
            </div>
        </div>

        <div class="auth-decoration">
            <div class="auth-shape auth-shape-1"></div>
            <div class="auth-shape auth-shape-2"></div>
        </div>
    </div>
</section>
{% endblock %}
