{% extends 'base.html' %}
{% block title %}Create Rep Account{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-container auth-container-wide">
    <div class="auth-card auth-card-wide">
      <a href="{{ url_for('admin.dashboard') }}" class="back-link">← Back to Admin</a>

      <div class="auth-header">
        <h1>Create Rep Account</h1>
        <p>Add a new customer representative to the platform.</p>
      </div>

      <form method="POST" class="auth-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" name="first_name" value="{{ first_name or '' }}" required class="form-input" placeholder="First name">
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" name="last_name" value="{{ last_name or '' }}" required class="form-input" placeholder="Last name">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Username</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" name="username" value="{{ username or '' }}" required class="form-input" placeholder="Choose a username">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <span class="input-icon">✉</span>
            <input type="email" name="email" value="{{ email or '' }}" required class="form-input" placeholder="Email address">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" name="password" required class="form-input" placeholder="Set a password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Create Rep Account
          <span class="btn-arrow">→</span>
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
