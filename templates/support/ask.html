{% extends 'base.html' %}
{% block title %}Ask a Question{% endblock %}

{% block content %}
<section class="page-section">
  <div class="page-container narrow">
    <div class="page-header">
      <a href="{{ url_for('support.my_questions') }}" class="back-link">← My Questions</a>
      <h1>Ask Customer Support</h1>
      <p>A customer representative will reply as soon as possible.</p>
    </div>

    <div class="table-card panel-card">
      <form method="POST" class="auth-form">
        <div class="form-group">
          <label class="form-label">Subject</label>
          <input type="text" name="subject" value="{{ subject or '' }}" required placeholder="Brief description of your issue" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Message</label>
          <textarea name="body" rows="6" required placeholder="Describe your question or issue in detail..." class="form-input">{{ body or '' }}</textarea>
        </div>
        <div class="panel-actions">
          <button type="submit" class="btn btn-primary">Submit Question</button>
          <a href="{{ url_for('support.my_questions') }}" class="btn btn-ghost">Cancel</a>
        </div>
      </form>
    </div>

    <p class="results-count">Looking for an existing answer? <a href="{{ url_for('support.search') }}">Search Q&amp;A</a></p>
  </div>
</section>
{% endblock %}
